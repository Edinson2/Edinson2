<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shatalito - Revisar Pedido y Pagar</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .pagar-principal {
            display: flex;
            flex-direction: column;
            align-items: center; /* Centrar horizontalmente el contenido */
            padding: 15px;
        }

        #resumen-pedido {
            width: 90%; /* Ocupar un porcentaje del ancho para responsividad */
            max-width: 600px; /* Ancho máximo para pantallas grandes */
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            box-sizing: border-box; /* Incluir padding y border en el ancho */
        }

        .datos-pago {
            width: 90%; /* Ocupar un porcentaje del ancho para responsividad */
            max-width: 600px; /* Ancho máximo para pantallas grandes */
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            box-sizing: border-box; /* Incluir padding y border en el ancho */
        }

        .datos-pago form div {
            margin-bottom: 10px;
        }

        .datos-pago label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.95em;
        }

        .datos-pago input[type="number"],
        .datos-pago input[type="text"] {
            width: 100%;
            padding: 0.6em;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.9em;
        }

        .datos-pago small {
            display: block;
            font-size: 0.8em;
            color: #777;
            margin-top: 3px;
        }

        .datos-pago button[type="submit"] {
            width: 100%;
            padding: 0.8em;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }

        .datos-pago button[type="submit"]:hover {
            background-color: #4cae4c;
        }

        /* Media query para pantallas más grandes (opcional: para un diseño lado a lado) */
        @media (min-width: 769px) {
            .pagar-principal {
                flex-direction: row;
                justify-content: center;
                align-items: flex-start;
                gap: 20px;
                padding: 20px;
            }

            #resumen-pedido,
            .datos-pago {
                width: 45%; /* Ocupar casi la mitad del ancho en pantallas más grandes */
                max-width: none; /* Eliminar el ancho máximo para el diseño lado a lado */
            }

            .datos-pago button[type="submit"] {
                width: auto; /* Ajustar el ancho del botón al contenido */
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Shatalito - Revisar Pedido y Pagar</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="menu.html">Menú</a></li>
                <li><a href="carrito.html">Carrito <img src="imagen/carrito.jpg" alt="Carrito" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 6px;">  (<span id="cantidad-items-carrito">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="pagar-principal">
        <section id="resumen-pedido">
            <h2>Detalles del Pedido</h2>
            <ul id="lista-items-pedido">
                </ul>
            <p class="total">Total a Pagar: $<span id="total-pagar">0.00</span></p>
        </section>

        <section class="datos-pago">
            <h2>Datos de Pago</h2>
            <form id="formulario-pago" action="pedido_pagado.html" method="get">
                <div>
                    <label for="dni">Documento DNI:</label>
                    <input type="number" id="dni" placeholder="Ingrese su DNI" required>
                </div>
                <div>
                    <label for="tarjeta">Número de Tarjeta:</label>
                    <input type="number" id="tarjeta" placeholder="Ingrese el número de su tarjeta" required>
                </div>
                <div>
                    <label for="vencimiento">Fecha de Vencimiento:</label>
                    <input type="text" id="vencimiento" placeholder="MM/AA" pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$" required>
                    <small>Formato: MM/AA</small>
                </div>
                <div>
                    <label for="cvv">CVV:</label>
                    <input type="number" id="cvv" placeholder="Ingrese el CVV" pattern="^[0-9]{3,4}$" required>
                    <small>3 o 4 dígitos</small>
                </div>
                <div>
                    <label for="nombre">Nombre del Titular:</label>
                    <input type="text" id="nombre" placeholder="Ingrese el nombre como aparece en la tarjeta" required>
                </div>
                <div>
                    <label for="email">Direccion de correo electronico:</label>
                    <input type="email" id="email" placeholder="Ingrese la direccion de correo electronico" required>
                </div>

                <button class="button">Realizar Pago</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Shatalito</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
